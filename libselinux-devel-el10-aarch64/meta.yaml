package:
  name: libselinux-devel-el10-aarch64
  version: 3.8

source:
  - url: https://download.rockylinux.org/vault/rocky/10.0/AppStream/aarch64/os/Packages/l/libselinux-devel-3.8-2.el10_0.aarch64.rpm
    sha256: 3e5deece40908ed30504adf6cd369610e2493e8a9494579fe7e6dd408ab955ab
    no_hoist: true
    folder: binary

build:
  skip: True  # [not (linux and aarch64)]
  number: {{ build_number }}
  noarch: generic
  binary_relocation: false
  detect_binary_files_with_prefix: false

requirements:
  host:
  run:
    - sysroot_linux-aarch64 2.39.*
    - libselinux-el10-aarch64 ==3.8 *_{{ build_number }}
    - libsepol-devel-el10-aarch64 >=3.8 *_{{ build_number }}
    - pcre2

test:
  requires:
    - pkg-config
  commands:
    - test -f ${PREFIX}/aarch64-conda_el10-linux-gnu/sysroot/usr/include/selinux/selinux.h
    - test -f ${PREFIX}/aarch64-conda_el10-linux-gnu/sysroot/usr/lib64/libselinux.so
    - export PKG_CONFIG_PATH=${PREFIX}/aarch64-conda_el10-linux-gnu/sysroot/usr/lib64/pkgconfig
    - pkg-config --cflags libselinux

about:
  home: https://github.com/SELinuxProject/selinux/wiki
  license: libselinux-1.0  # LicenseRef-Fedora-Public-Domain
  license_family: Other
  license_file:
    - LICENSE
  summary: (CDT) Header files and libraries used to build SELinux
  description: |
    The libselinux-devel package contains the libraries and header files
    needed for developing SELinux applications.
  doc_url: https://github.com/SELinuxProject/selinux/wiki
  dev_url: https://github.com/SELinuxProject/selinux/wiki

extra:
  recipe-maintainers:
    - conda-forge/help-cdts
