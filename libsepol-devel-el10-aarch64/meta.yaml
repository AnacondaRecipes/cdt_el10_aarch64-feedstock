package:
  name: libsepol-devel-el10-aarch64
  version: 3.8

source:
  - url: https://download.rockylinux.org/vault/rocky/10.0/AppStream/aarch64/os/Packages/l/libsepol-devel-3.8-1.el10.aarch64.rpm
    sha256: 4df97f9bb14f6f03e800bc30d0a6232307d01646c3f20b553dbf1dd052cb016a
    no_hoist: true
    folder: binary

build:
  skip: True  # [not (linux and aarch64)]
  number: {{ build_number }}
  noarch: generic
  binary_relocation: false
  detect_binary_files_with_prefix: false

requirements:
  host:
  run:
    - libsepol-el10-aarch64 ==3.8 *_{{ build_number }}

test:
  requires:
    - pkg-config
  commands:
    - test -f ${PREFIX}/aarch64-conda_el10-linux-gnu/sysroot/usr/include/sepol/sepol.h
    - test -f ${PREFIX}/aarch64-conda_el10-linux-gnu/sysroot/usr/lib64/libsepol.so
    - export PKG_CONFIG_PATH=${PREFIX}/aarch64-conda_el10-linux-gnu/sysroot/usr/lib64/pkgconfig
    - pkg-config --cflags libsepol

about:
  home: https://github.com/SELinuxProject/selinux/wiki
  license: LGPL-2.1-only  # LGPL-2.1-or-later
  license_family: LGPL
  license_file:
    - LICENSE
  summary: (CDT) Header files and libraries used to build policy manipulation tools
  description: |
    The libsepol-devel package contains the libraries and header files
    needed for developing applications that manipulate binary policies.
  doc_url: https://github.com/SELinuxProject/selinux/wiki
  dev_url: https://github.com/SELinuxProject/selinux/wiki

extra:
  recipe-maintainers:
    - conda-forge/help-cdts
