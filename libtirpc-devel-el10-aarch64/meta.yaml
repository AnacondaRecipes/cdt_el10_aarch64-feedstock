package:
  name: libtirpc-devel-el10-aarch64
  version: 1.3.5

source:
  - url: https://download.rockylinux.org/vault/rocky/10.0/devel/aarch64/os/Packages/l/libtirpc-devel-1.3.5-1.el10.aarch64.rpm
    sha256: 65104632fae009efb8119e9ebcf853e2e543599aef83256871b6fa1f2a088e06
    no_hoist: true
    folder: binary

build:
  skip: True  # [not (linux and aarch64)]
  number: {{ build_number }}
  noarch: generic
  binary_relocation: false
  detect_binary_files_with_prefix: false

requirements:
  host:
  run:
    - libtirpc-el10-aarch64 ==1.3.5 *_{{ build_number }}
    - pkgconfig

test:
  requires:
    - pkg-config
  commands:
    - test -f ${PREFIX}/aarch64-conda_el10-linux-gnu/sysroot/usr/include/tirpc/netconfig.h
    - test -f ${PREFIX}/aarch64-conda_el10-linux-gnu/sysroot/lib64/libtirpc.so
    - export PKG_CONFIG_PATH=${PREFIX}/aarch64-conda_el10-linux-gnu/sysroot/usr/lib64/pkgconfig
    - pkg-config --cflags libtirpc

about:
  home: http://git.linux-nfs.org/?p=steved/libtirpc.git;a=summary
  license: BSD-3-Clause  # SISSL AND BSD-3-Clause
  license_family: BSD
  license_file:
    - COPYING
  summary: (CDT) Development files for the libtirpc library
  description: |
    This package includes header files and libraries necessary for
    developing programs which use the tirpc library.
  doc_url: http://git.linux-nfs.org/?p=steved/libtirpc.git;a=summary
  dev_url: http://git.linux-nfs.org/?p=steved/libtirpc.git;a=summary

extra:
  recipe-maintainers:
    - conda-forge/help-cdts
