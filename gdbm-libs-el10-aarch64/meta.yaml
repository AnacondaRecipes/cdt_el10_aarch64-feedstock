package:
  name: gdbm-libs-el10-aarch64
  version: 1.23

source:
  - url: https://download.rockylinux.org/vault/rocky/10.0/BaseOS/aarch64/os/Packages/g/gdbm-libs-1.23-12.el10_0.aarch64.rpm
    sha256: 8d19c5d8bdc75972642accf2af2dfd5c08099cfe78478cd15eeaec5141e1ac74
    no_hoist: true
    folder: binary

build:
  skip: True  # [not (linux and aarch64)]
  number: {{ build_number }}
  noarch: generic
  binary_relocation: false
  detect_binary_files_with_prefix: false
  missing_dso_whitelist:
    - '*'

requirements:
  build:
    - sysroot_linux-aarch64 2.39.*
  host:
  run:
    - sysroot_linux-aarch64 2.39.*

test:
  commands:
    - test -f ${PREFIX}/aarch64-conda_el10-linux-gnu/sysroot/usr/lib64/libgdbm.so.6.0.0

about:
  home: http://www.gnu.org/software/gdbm/
  license: BSD-3-Clause or GPL-2.0-only  # GPL-3.0-or-later
  license_family: GPL2
  license_file:
    - COPYING
  summary: (CDT) Libraries files for gdbm
  description: |
    Libraries for the Gdbm GNU database indexing library
  doc_url: http://www.gnu.org/software/gdbm/
  dev_url: http://www.gnu.org/software/gdbm/

extra:
  recipe-maintainers:
    - conda-forge/help-cdts
