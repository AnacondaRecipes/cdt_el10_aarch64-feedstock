package:
  name: pam-el10-aarch64
  version: 1.6.1

source:
  - url: https://download.rockylinux.org/vault/rocky/10.0/BaseOS/aarch64/os/Packages/p/pam-1.6.1-7.el10.aarch64.rpm
    sha256: 415bc242b5f31651c3a06024a741bddb20e5640f6303803fbe0b56fbbe01c577
    no_hoist: true
    folder: binary

build:
  skip: True  # [not (linux and aarch64)]
  number: {{ build_number }}
  noarch: generic
  binary_relocation: false
  detect_binary_files_with_prefix: false
  missing_dso_whitelist:
    - '*'

requirements:
  build:
    - sysroot_linux-aarch64 2.39.*
  host:
  run:
    - sysroot_linux-aarch64 2.39.*
    - audit-libs-el10-aarch64 >=4.0.3 *_{{ build_number }}
    - libpwquality-el10-aarch64 >=1.4.5 *_{{ build_number }}
    - libselinux-el10-aarch64 >=3.8 *_{{ build_number }}
    - libtirpc-el10-aarch64 >=1.3.5 *_{{ build_number }}
    - libxcrypt-el10-aarch64 >=4.4.36 *_{{ build_number }}
    - openssl 3  # libcrypto.so.3

test:
  commands:
    - test -f ${PREFIX}/aarch64-conda_el10-linux-gnu/sysroot/usr/lib64/security/pam_unix.so

about:
  home: http://www.linux-pam.org/
  license: BSD-3-Clause or GPL-2.0-only  # BSD-3-Clause AND GPL-2.0-or-later
  license_family: GPL2
  license_file:
    - Copyright
    - gpl-2.0.txt
  summary: (CDT) An extensible library which provides authentication for applications
  description: |
    PAM (Pluggable Authentication Modules) is a system security tool that
    allows system administrators to set authentication policy without
    having to recompile programs that handle authentication.
  doc_url: http://www.linux-pam.org/
  dev_url: http://www.linux-pam.org/

extra:
  recipe-maintainers:
    - conda-forge/help-cdts
