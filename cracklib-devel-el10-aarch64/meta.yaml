package:
  name: cracklib-devel-el10-aarch64
  version: 2.9.11

source:
  - url: https://download.rockylinux.org/vault/rocky/10.0/devel/aarch64/os/Packages/c/cracklib-devel-2.9.11-8.el10.aarch64.rpm
    sha256: 2d27076120f2382bc40b62ca51e81baab1f7b364709022e9173724a19b2b43ec
    no_hoist: true
    folder: binary

build:
  skip: True  # [not (linux and aarch64)]
  number: {{ build_number }}
  noarch: generic
  binary_relocation: false
  detect_binary_files_with_prefix: false

requirements:
  host:
  run:
    - sysroot_linux-aarch64 2.39.*
    - cracklib-el10-aarch64 ==2.9.11 *_{{ build_number }}

test:
  commands:
    - test -f ${PREFIX}/aarch64-conda_el10-linux-gnu/sysroot/usr/include/crack.h
    - test -f ${PREFIX}/aarch64-conda_el10-linux-gnu/sysroot/usr/lib64/libcrack.so

about:
  home: https://github.com/cracklib/cracklib
  license: LGPL-2.1-only  # LGPL-2.1-or-later
  license_family: LGPL
  license_file:
    - COPYING.LIB
  summary: (CDT) Development files needed for building applications which use cracklib
  description: |
    The cracklib-devel package contains the header files and libraries needed
    for compiling applications which use cracklib.
  doc_url: https://github.com/cracklib/cracklib
  dev_url: https://github.com/cracklib/cracklib

extra:
  recipe-maintainers:
    - conda-forge/help-cdts
