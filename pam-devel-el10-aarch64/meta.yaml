package:
  name: pam-devel-el10-aarch64
  version: 1.6.1

source:
  - url: https://download.rockylinux.org/vault/rocky/10.0/AppStream/aarch64/os/Packages/p/pam-devel-1.6.1-7.el10.aarch64.rpm
    sha256: 31bb60f92c7f00b919ac126e2d1e1fd4ed12eee112d470cf2b7b5c407889d1fa
    no_hoist: true
    folder: binary

build:
  skip: True  # [not (linux and aarch64)]
  number: {{ build_number }}
  noarch: generic
  binary_relocation: false
  detect_binary_files_with_prefix: false

requirements:
  host:
  run:
    - pam-el10-aarch64 ==1.6.1 *_{{ build_number }}
    - audit-libs-devel-el10-aarch64 >=4.0.3 *_{{ build_number }}
    - libpwquality-devel-el10-aarch64 >=1.4.5 *_{{ build_number }}
    - libselinux-devel-el10-aarch64 >=3.8 *_{{ build_number }}
    - libtirpc-devel-el10-aarch64 >=1.3.5 *_{{ build_number }}
    - libxcrypt-devel-el10-aarch64 >=4.4.36 *_{{ build_number }}

test:
  commands:
    - test -f ${PREFIX}/aarch64-conda_el10-linux-gnu/sysroot/usr/include/security/pam_client.h
    - test -f ${PREFIX}/aarch64-conda_el10-linux-gnu/sysroot/usr/lib64/pkgconfig/pam.pc

about:
  home: http://www.linux-pam.org/
  license: BSD-3-Clause or GPL-2.0-only  # BSD-3-Clause AND GPL-2.0-or-later
  license_family: GPL2
  license_file:
    - gpl-2.0.txt
    - Copyright
  summary: (CDT) Files needed for developing PAM-aware applications and modules for PAM
  description: |
    PAM (Pluggable Authentication Modules) is a system security tool that
    allows system administrators to set authentication policy without
    having to recompile programs that handle authentication. This package
    contains header files used for building both PAM-aware applications
    and modules for use with the PAM system.
  doc_url: http://www.linux-pam.org/
  dev_url: http://www.linux-pam.org/

extra:
  recipe-maintainers:
    - conda-forge/help-cdts
